    <script>
      // Load runtime configuration from Static Web Apps environment variables
      // These are injected as window properties by Azure Static Web Apps
      window.__apiConfig = {
        apiBaseUrl: window.__STATIC_WEB_APPS_APP_CONFIG__?.apiBaseUrl ||
                   localStorage.getItem('apiBaseUrl') ||
                   'https://liftwatch-api-flex.azurewebsites.net/api'
      };
      // Store in localStorage as fallback for future page loads
      localStorage.setItem('apiBaseUrl', window.__apiConfig.apiBaseUrl);
    </script>
