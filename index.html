    <script>
      // Load runtime configuration from Static Web Apps environment variables
      // These are injected as window properties by Azure Static Web Apps
      const runtimeApiBaseUrl = window.__STATIC_WEB_APPS_APP_CONFIG__?.apiBaseUrl || '';
      const storedApiBaseUrl = localStorage.getItem('apiBaseUrl') || '';

      const resolvedApiBaseUrl =
        runtimeApiBaseUrl ||
        (storedApiBaseUrl ? storedApiBaseUrl : '') ||
        '/api';

      window.__apiConfig = {
        apiBaseUrl: resolvedApiBaseUrl
      };

      if (resolvedApiBaseUrl) {
        localStorage.setItem('apiBaseUrl', resolvedApiBaseUrl);
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
